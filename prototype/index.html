<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ultra Fan is a live concert platform where artists run professional livestream events and fans buy tickets to watch from anywhere."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ultra Fan | Live Concert Experience" />
    <meta
      property="og:description"
      content="Ticketed livestream concerts with creator-grade control room tools and secure fan access."
    />
    <meta property="og:image" content="/assets/ultra-fan-twitter-card.svg" />
    <meta property="og:image:alt" content="Ultra Fan live concert experience preview card." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ultra Fan | Live Concert Experience" />
    <meta
      name="twitter:description"
      content="Ticketed livestream concerts with creator-grade control room tools and secure fan access."
    />
    <meta name="twitter:image" content="/assets/ultra-fan-twitter-card.svg" />
    <meta name="twitter:image:alt" content="Ultra Fan live concert experience preview card." />
    <meta name="theme-color" content="#1a8a65" />
    <title>Ultra Fan | Live Concert Experience</title>
    <link rel="icon" type="image/svg+xml" href="/assets/ultra-fan-logo.svg" />
    <link rel="apple-touch-icon" href="/assets/ultra-fan-logo.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-left">
        <div class="brand">
          <span class="brand-icon">&#9889;</span>
          <span class="brand-text">ULTRA FAN</span>
        </div>
      </div>
      <nav class="main-nav" aria-label="Primary">
        <button data-route="discover" class="nav-btn active">Discover</button>
        <button data-route="library" class="nav-btn">My Library</button>
        <button data-route="creator" class="nav-btn">Creator Studio</button>
        <button data-route="account" class="nav-btn">Account</button>
      </nav>
      <div class="header-right">
        <div id="userIndicator" class="user-indicator"></div>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>

    <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
